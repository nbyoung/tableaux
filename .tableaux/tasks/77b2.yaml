title: "tablo: backend library and plumbing"
description: >
  The backend. A Go library that loads a project from a worktree or any Git ref, validates it against the schemas and the rules in README.md, derives junctions, requirement conditions, authorisation, review, roll-up and history, audits the result and produces every abstract view as data. A plumbing command exposes the library as JSON for scripts and for the front ends, as Git's plumbing serves its porcelain.
  Its plan lives in its own repository, which this repository pins as the
  submodule subprojects/tablo; this task tracks that project's root
  task through recursive junctions from the mockup gate onward.
