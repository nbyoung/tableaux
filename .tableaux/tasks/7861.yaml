title: Productivity evidence
description: >
  The measure of the aim. A script over the Git history of every repository in
  the effort reports, per task and per gate, the agent commits, the human
  review and authorisation commits, and the elapsed time between them. The
  validate gate reads the numbers against the aim: human attention goes to
  strategic junctions and agents carry the rest. The report feeds the next
  refinement of the method.
