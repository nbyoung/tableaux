title: Roles
description: >
  A section of README.md that names the roles a project derives from its files
  and its history: owner, authority, assignee, contributor, agent, reviewer and
  observer. Each role states who holds it, what it may do and which views serve
  it. Nothing declares a role; a person or agent holds it wherever their email
  appears in that position.
