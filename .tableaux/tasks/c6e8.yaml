title: "tablotui: terminal user interface"
description: >
  The terminal front end. A full-screen tableau with expand and collapse over the task tree, a gate window with per-viewer column hiding that persists, and panes for the task, the queue, the blockage tree and the history, refreshed when the repository changes. It serves a participant working in a shell beside their editor and their agent.
  Its plan lives in its own repository, which this repository pins as the
  submodule subprojects/tablotui; this task tracks that project's root
  task through recursive junctions from the mockup gate onward.
