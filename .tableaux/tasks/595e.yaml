title: "tableaud: local daemon and HTML"
description: >
  The graphical front end. A daemon that a participant runs from the checked-out repository and that serves every view as HTML with role-specific progressive disclosure: the owner explores top-down through the task hierarchy, a contributor starts at the parents of their tasks with a gate window around their next gates. The viewer shows and hides columns and the choice persists; the server holds no column policy of its own. It also exports a static bundle for hosting without a daemon.
  Its plan lives in its own repository, which this repository pins as the
  submodule subprojects/tableaud; this task tracks that project's root
  task through recursive junctions from the mockup gate onward.
