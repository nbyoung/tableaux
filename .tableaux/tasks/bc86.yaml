title: Markdown views
description: >
  Hand-made Markdown mockups of every view, one file each under docs/mockups/, depicting this project. Markdown is the static medium: a STATUS.md that CI regenerates, an attachment to email or chat, a brief pasted into an agent's prompt. A mockup fits in a single file and reads well in a plain Markdown renderer. The defined gate agrees what the view shows in Markdown; the mockup gate delivers the file; later gates belong to the tabloio subproject.
